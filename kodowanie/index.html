<!DOCTYPE html>
<html lang="csb">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Ùprôwianié kòdowaniô tekstu</title>
 <style>
 :root {
 --primary: #1d4ed8;
 --primary-hover: #1e40af;
 --bg: #f8fafc;
 --card-bg: #ffffff;
 --border: #cbd5e1;
 --text: #0f172a;
 --text-muted: #64748b;
 --success: #15803d;
 --kashubian-badge: #fef08a;
 --kashubian-border: #eab308;
 }

 * { box-sizing: border-box; }

 body {
 font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
 background-color: var(--bg);
 color: var(--text);
 line-height: 1.5;
 padding: 24px;
 margin: 0;
 }

 .container {
 max-width: 1100px;
 margin: 0 auto;
 background: var(--card-bg);
 border-radius: 12px;
 padding: 24px 32px;
 box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
 border: 1px solid var(--border);
 }

 h1 {
 font-size: 1.6rem;
 margin-top: 0;
 margin-bottom: 6px;
 color: var(--primary);
 }

 p.subtitle {
 color: var(--text-muted);
 margin-top: 0;
 margin-bottom: 20px;
 font-size: 0.95rem;
 }

 .demo-bar {
 display: flex;
 flex-wrap: wrap;
 gap: 10px;
 align-items: center;
 background-color: #f1f5f9;
 padding: 12px 16px;
 border-radius: 8px;
 margin-bottom: 20px;
 font-size: 0.9rem;
 }

 .demo-bar span {
 font-weight: 600;
 color: var(--text-muted);
 }

 .btn-secondary {
 background: #e2e8f0;
 color: var(--text);
 border: 1px solid #cbd5e1;
 padding: 6px 12px;
 border-radius: 6px;
 font-size: 0.85rem;
 font-weight: 500;
 cursor: pointer;
 transition: background 0.2s;
 }

 .btn-secondary:hover {
 background: #cbd5e1;
 }

 .form-grid {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 16px;
 margin-bottom: 20px;
 }

 .panels-grid {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 20px;
 margin-bottom: 16px;
 }

 @media (max-width: 768px) {
 .form-grid, .panels-grid { grid-template-columns: 1fr; }
 }

 .panel-header {
 display: flex;
 justify-content: space-between;
 align-items: center;
 margin-bottom: 8px;
 min-height: 32px;
 }

 .panel-header label {
 margin-bottom: 0;
 }

 label {
 display: block;
 font-weight: 600;
 font-size: 0.88rem;
 margin-bottom: 6px;
 }

 select, input[type="file"] {
 width: 100%;
 padding: 9px 12px;
 border: 1px solid var(--border);
 border-radius: 6px;
 background: #fff;
 font-size: 0.9rem;
 }

 select:focus, textarea:focus {
 outline: 2px solid var(--primary);
 border-color: transparent;
 }

 textarea {
 width: 100%;
 height: 320px;
 padding: 14px;
 border: 1px solid var(--border);
 border-radius: 8px;
 font-family: "Consolas", "Courier New", monospace;
 font-size: 0.92rem;
 resize: vertical;
 background: #fdfdfd;
 }

 textarea#originalText {
 background: #f8fafc;
 }

 .stats {
 display: flex;
 flex-wrap: wrap;
 gap: 8px;
 align-items: center;
 font-size: 0.85rem;
 margin-bottom: 20px;
 background: #f8fafc;
 padding: 10px 14px;
 border-radius: 6px;
 border: 1px solid #e2e8f0;
 }

 .stats strong {
 margin-right: 4px;
 }

 .badge {
 display: inline-block;
 padding: 2px 8px;
 border-radius: 4px;
 background: var(--kashubian-badge);
 border: 1px solid var(--kashubian-border);
 font-weight: 600;
 }

 .actions {
 display: flex;
 justify-content: space-between;
 align-items: center;
 flex-wrap: wrap;
 gap: 12px;
 }

 .action-buttons {
 display: flex;
 gap: 10px;
 flex-wrap: wrap;
 }

 .btn-primary {
 background-color: var(--primary);
 color: #ffffff;
 border: none;
 padding: 10px 20px;
 border-radius: 6px;
 font-weight: 600;
 font-size: 0.95rem;
 cursor: pointer;
 transition: background-color 0.2s;
 }

 .btn-primary:hover {
 background-color: var(--primary-hover);
 }

 .status-msg {
 font-size: 0.85rem;
 color: var(--success);
 font-weight: 600;
 }
 </style>
</head>
<body>

 <div class="container">
 <h1>Ùprôwianié kòdowaniô tekstu</h1>
 <p class="subtitle">Nôrzãdze do kònwersëji felernëch kòdowaniów (Mojibake, Win-1250, Latin-2) do standardu UTF-8</p>

 <!-- Pokôzkòwé przëkłôdë -->
 <div class="demo-bar">
 <span>Wczytôj przëkłôd do pòkazu:</span>
 <button class="btn-secondary" id="demoMojibake">Zepsëti Kaszëbsczi (Mojibake)</button>
 <button class="btn-secondary" id="demoWin1250">Windows-1250 (Bajtë)</button>
 </div>

 <div class="form-grid">
 <div>
 <label for="enc">Zdrzódłowé kòdowanié / Tryb naprawë:</label>
 <select id="enc">
 <option value="windows-1250">Windows-1250 (ANSI Westrz-wsch Eùropa)</option>
 <option value="iso-8859-2">ISO-8859-2 (Latin-2 / Westrz-wsch Eùropa)</option>
 <option value="iso-8859-1">ISO-8859-1 (Latin-1 / Zôpadnô Eùropa)</option>
 <option value="mojibake">Mojibake (UTF-8 lëchò òdemkłi jakno Win-1250)</option>
 </select>
 </div>

 <div>
 <label for="fileInput">Wëbierzë lopk z kòmpùtra (abò wlep tekst niżi):</label>
 <input type="file" id="fileInput" accept=".txt,.csv,.srt,.sub,.html,.md">
 </div>
 </div>

 <!-- Dwa okna: Oryginał i Po naprawie -->
 <div class="panels-grid">
 <div>
 <div class="panel-header">
 <label for="originalText">Òriginalny (zepsëti) tekst:</label>
 <div style="display: flex; gap: 6px;">
 <button class="btn-secondary" id="pasteBtn" title="Wklej tekst ze schowka">📋 Wlep ze schòwka</button>
 <button class="btn-secondary" id="clearBtn" title="Wyczyść pola">✖ Wëczëszczë</button>
 </div>
 </div>
 <textarea id="originalText" placeholder="Wlep tùwò zepsëti tekst ze schòwka (Ctrl+V) abò wëbierzë lopk z diskù..."></textarea>
 </div>

 <div>
 <div class="panel-header">
 <label for="preview">Pòdzérk tekstu pò ùprawieniém (UTF-8):</label>
 <button class="btn-secondary" id="copyBtn" title="Skopiuj naprawiony tekst">📄 Skòpiuj wënik</button>
 </div>
 <textarea id="preview" placeholder="Tùwò pòkôże sã pòprawny tekst..."></textarea>
 </div>
 </div>

 <!-- Pòdsumòwanié lëtrów -->
 <div class="stats" id="stats">
 <strong>Kaszëbsczé lëtrë (w pòprawionym teksce):</strong>
 <span class="badge" id="stat-a">ã: 0</span>
 <span class="badge" id="stat-e">é: 0</span>
 <span class="badge" id="stat-eb">ë: 0</span>
 <span class="badge" id="stat-o">ò: 0</span>
 <span class="badge" id="stat-u">ù: 0</span>
 <span class="badge" id="stat-oh">ô: 0</span>
 <span class="badge" id="stat-z">ż: 0</span>
 </div>

 <div class="actions">
 <div class="action-buttons">
 <button class="btn-primary" id="saveBtn">💾 Zapiszë jakno UTF-8</button>
 </div>
 <span class="status-msg" id="status"></span>
 </div>
 </div>

 <script>
 let rawBuffer = null;
 let currentFileName = "sprowiony_tekst.txt";

 // Odwrotna tablica Windows-1250 dla znaków 0x80 - 0xFF do naprawy mojibake
 const win1250Map = {
 0x20AC: 0x80, 0x201A: 0x82, 0x201E: 0x84, 0x2026: 0x85, 0x2020: 0x86, 0x2021: 0x87,
 0x2030: 0x89, 0x0160: 0x8A, 0x2039: 0x8B, 0x015A: 0x8C, 0x0164: 0x8D, 0x017D: 0x8E,
 0x0179: 0x8F, 0x2018: 0x91, 0x2019: 0x92, 0x201C: 0x93, 0x201D: 0x94, 0x2022: 0x95,
 0x2013: 0x96, 0x2014: 0x97, 0x2122: 0x99, 0x0161: 0x9A, 0x203A: 0x9B, 0x015B: 0x9C,
 0x0165: 0x9D, 0x017E: 0x9E, 0x017A: 0x9F, 0x00A0: 0xA0, 0x02C7: 0xA1, 0x02D8: 0xA2,
 0x0141: 0xA3, 0x00A4: 0xA4, 0x0104: 0xA5, 0x00A6: 0xA6, 0x00A7: 0xA7, 0x00A8: 0xA8,
 0x00A9: 0xA9, 0x015E: 0xAA, 0x00AB: 0xAB, 0x00AC: 0xAC, 0x00AD: 0xAD, 0x00AE: 0xAE,
 0x017B: 0xAF, 0x00B0: 0xB0, 0x00B1: 0xB1, 0x02DB: 0xB2, 0x0142: 0xB3, 0x00B4: 0xB4,
 0x00B5: 0xB5, 0x00B6: 0xB6, 0x00B7: 0xB7, 0x00B8: 0xB8, 0x0105: 0xB9, 0x015F: 0xBA,
 0x00BB: 0xBB, 0x013D: 0xBC, 0x02DD: 0xBD, 0x013E: 0xBE, 0x017C: 0xBF, 0x0154: 0xC0,
 0x00C1: 0xC1, 0x00C2: 0xC2, 0x0102: 0xC3, 0x00C4: 0xC4, 0x0139: 0xC5, 0x0106: 0xC6,
 0x00C7: 0xC7, 0x010C: 0xC8, 0x00C9: 0xC9, 0x0118: 0xCA, 0x00CB: 0xCB, 0x011A: 0xCC,
 0x00CD: 0xCD, 0x00CE: 0xCE, 0x010E: 0xCF, 0x0110: 0xD0, 0x0143: 0xD1, 0x0147: 0xD2,
 0x00D3: 0xD3, 0x00D4: 0xD4, 0x0150: 0xD5, 0x00D6: 0xD6, 0x00D7: 0xD7, 0x0158: 0xD8,
 0x016E: 0xD9, 0x00DA: 0xDA, 0x0170: 0xDB, 0x00DC: 0xDC, 0x00DD: 0xDD, 0x0162: 0xDE,
 0x00DF: 0xDF, 0x0155: 0xE0, 0x00E1: 0xE1, 0x00E2: 0xE2, 0x0103: 0xE3, 0x00E4: 0xE4,
 0x013A: 0xE5, 0x0107: 0xE6, 0x00E7: 0xE7, 0x010D: 0xE8, 0x00E9: 0xE9, 0x0119: 0xEA,
 0x00EB: 0xEB, 0x011B: 0xEC, 0x00ED: 0xED, 0x00EE: 0xEE, 0x010F: 0xEF, 0x0111: 0xF0,
 0x0144: 0xF1, 0x0148: 0xF2, 0x00F3: 0xF3, 0x00F4: 0xF4, 0x0151: 0xF5, 0x00F6: 0xF6,
 0x00F7: 0xF7, 0x0159: 0xF8, 0x016F: 0xF9, 0x00FA: 0xFA, 0x0171: 0xFB, 0x00FC: 0xFC,
 0x00FD: 0xFD, 0x0163: 0xFE, 0x02D9: 0xFF
 };

 // Funkcja naprawiająca ciąg znaków Mojibake (np. "SzĂ«kaniĂ©" -> "Szëkanié")
 function fixMojibakeFromString(mojibakeStr) {
 const byteList = [];

 for (let i = 0; i < mojibakeStr.length; i++) {
 const code = mojibakeStr.charCodeAt(i);
 if (code < 128) {
 byteList.push(code);
 } else if (win1250Map[code] !== undefined) {
 byteList.push(win1250Map[code]);
 } else if (code >= 0x80 && code <= 0xFF) {
 // Obsługa ewentualnych surowych kodów kontrolnych (np. 0x81, 0x83, 0x88, 0x90, 0x98)
 byteList.push(code);
 } else {
 byteList.push(63); // '?' przy braku dopasowania
 }
 }

 return new TextDecoder('utf-8', { fatal: false }).decode(new Uint8Array(byteList));
 }

 // Sprawdzanie, czy tekst wygląda na typowe kaszubskie/polskie mojibake
 function looksLikeMojibake(str) {
 return /Ă«|Ă©|Ă˛|Ă´|Ăą|ĂŁ|Ĺ‚|ĹĽ|Ĺ„|Ä…|Ă‹|Ă’/.test(str);
 }

 function showStatus(msg) {
 const statusEl = document.getElementById('status');
 statusEl.textContent = msg;
 setTimeout(() => {
 if (statusEl.textContent === msg) statusEl.textContent = "";
 }, 3000);
 }

 function countLetters(text) {
 const lower = text.toLowerCase();
 document.getElementById('stat-a').textContent = `ã: ${(lower.match(/ã/g) || []).length}`;
 document.getElementById('stat-e').textContent = `é: ${(lower.match(/é/g) || []).length}`;
 document.getElementById('stat-eb').textContent = `ë: ${(lower.match(/ë/g) || []).length}`;
 document.getElementById('stat-o').textContent = `ò: ${(lower.match(/ò/g) || []).length}`;
 document.getElementById('stat-u').textContent = `ù: ${(lower.match(/ù/g) || []).length}`;
 document.getElementById('stat-oh').textContent = `ô: ${(lower.match(/ô/g) || []).length}`;
 document.getElementById('stat-z').textContent = `ż: ${(lower.match(/ż/g) || []).length}`;
 }

 // Główna funkcja przetwarzająca dane
 function processData() {
 const enc = document.getElementById('enc').value;
 const originalTextarea = document.getElementById('originalText');
 const previewTextarea = document.getElementById('preview');
 let result = "";

 try {
 if (rawBuffer) {
 // Jeśli mamy wgrany plik binarny (lub bufor z demo)
 const utf8String = new TextDecoder('utf-8').decode(rawBuffer);

 if (enc === 'mojibake') {
 originalTextarea.value = utf8String;
 result = fixMojibakeFromString(utf8String);
 } else {
 // Dla jednobajtowych kodowań (Win-1250, ISO) pokazujemy po lewej surowy odczyt UTF-8 (z błędami ) lub Latin-1
 originalTextarea.value = utf8String;
 result = new TextDecoder(enc).decode(rawBuffer);
 }
 } else {
 // Jeśli użytkownik wkleił lub wpisał tekst ręcznie w lewym oknie
 const inputStr = originalTextarea.value;
 if (!inputStr) {
 previewTextarea.value = "";
 countLetters("");
 return;
 }

 if (enc === 'mojibake') {
 result = fixMojibakeFromString(inputStr);
 } else {
 // Przy wklejaniu ze schowka tekst jest już w UTF-16/UTF-8 w przeglądarce,
 // więc naprawa ma sens poprzez odwrócenie Mojibake
 result = fixMojibakeFromString(inputStr);
 }
 }
 } catch (err) {
 result = "Fela òdczëtaniô kòdowaniô: " + err.message;
 }

 previewTextarea.value = result;
 countLetters(result);
 showStatus("Pòprawno zaktualizowóné!");
 }

 // Obsługa wgrania pliku z dysku
 document.getElementById('fileInput').addEventListener('change', (e) => {
 const file = e.target.files[0];
 if (!file) return;
 currentFileName = "utf8_" + file.name;
 const reader = new FileReader();
 reader.onload = (evt) => {
 rawBuffer = evt.target.result;

 // Automatyczna detekcja: jeśli plik w UTF-8 zawiera krzaczki mojibake, przełącz select na 'mojibake'
 const testUtf8 = new TextDecoder('utf-8').decode(rawBuffer);
 if (looksLikeMojibake(testUtf8)) {
 document.getElementById('enc').value = 'mojibake';
 }

 processData();
 };
 reader.readAsArrayBuffer(file);
 });

 // Zmiana kodowania na liście rozwijanej
 document.getElementById('enc').addEventListener('change', processData);

 // Ręczne wpisywanie / wklejanie tekstu w lewym polu (Oryginał)
 document.getElementById('originalText').addEventListener('input', () => {
 rawBuffer = null; // Przechodzimy w tryb tekstu wklejonego
 document.getElementById('fileInput').value = ""; // Reset kontrolki pliku
 if (looksLikeMojibake(document.getElementById('originalText').value)) {
 document.getElementById('enc').value = 'mojibake';
 }
 processData();
 });

 // Ręczna edycja w prawym polu (Podgląd)
 document.getElementById('preview').addEventListener('input', (e) => {
 countLetters(e.target.value);
 });

 // Przycisk: Wklej ze schowka
 document.getElementById('pasteBtn').addEventListener('click', async () => {
 try {
 const text = await navigator.clipboard.readText();
 if (text) {
 rawBuffer = null;
 document.getElementById('fileInput').value = "";
 document.getElementById('originalText').value = text;
 if (looksLikeMojibake(text)) {
 document.getElementById('enc').value = 'mojibake';
 }
 processData();
 showStatus("Wlepioné ze schówka!");
 }
 } catch (err) {
 alert("Nie mòżna bëło òdczëtac schówka aùtomatno. Klikni w lewé pòle i wcësni Ctrl+V.");
 }
 });

 // Przycisk: Wyczyść
 document.getElementById('clearBtn').addEventListener('click', () => {
 rawBuffer = null;
 document.getElementById('fileInput').value = "";
 document.getElementById('originalText').value = "";
 document.getElementById('preview').value = "";
 countLetters("");
 showStatus("Pòla wëczëszczoné.");
 });

 // Przycisk: Kopiuj wynik
 document.getElementById('copyBtn').addEventListener('click', async () => {
 const content = document.getElementById('preview').value;
 if (!content) return;
 try {
 await navigator.clipboard.writeText(content);
 showStatus("Skòpérowóné do schówka!");
 } catch (err) {
 document.getElementById('preview').select();
 document.execCommand('copy');
 showStatus("Skòpérowóné do schówka!");
 }
 });

 // Przycisk: Zapisz do pliku
 document.getElementById('saveBtn').addEventListener('click', () => {
 const content = document.getElementById('preview').value;
 if (!content) return;
 const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
 const a = document.createElement('a');
 a.href = URL.createObjectURL(blob);
 a.download = currentFileName;
 a.click();
 URL.revokeObjectURL(a.href);
 showStatus("Lopk òstôł zapisóny jakno UTF-8!");
 });

 // Przykład Mojibake (prawdziwe mojibake wygenerowane z UTF-8 przez tablicę Windows-1250)
 document.getElementById('demoMojibake').addEventListener('click', () => {
 currentFileName = "kaszebsczi_mojibake_utf8.txt";
 document.getElementById('enc').value = "mojibake";
 document.getElementById('fileInput').value = "";

 const sampleUtf8 = "Szëkanié robòtë na Zôpôdze.\nKaszëbskô mòwa to nasz drodżi skôrb. Żëjã w Pòlsce, gôdómë pò kaszëbskù, czëtómë knéżczi i ùczimë dzecë.";
 const utf8Bytes = new TextEncoder().encode(sampleUtf8);
 // Tworzymy prawdziwy string mojibake (interpretujemy bajty UTF-8 jako znaki Windows-1250)
 const corruptedMojibakeString = new TextDecoder('windows-1250').decode(utf8Bytes);
 // Zapisujemy ten zepsuty string jako bufor UTF-8 (dokładnie tak, jak w pliku tekst_mojibake.txt)
 rawBuffer = new TextEncoder().encode(corruptedMojibakeString).buffer;

 processData();
 });

 // Przykład Win-1250: surowe bajty w kodowaniu Windows-1250
 document.getElementById('demoWin1250').addEventListener('click', () => {
 currentFileName = "tekst_win1250_utf8.txt";
 document.getElementById('enc').value = "windows-1250";
 document.getElementById('fileInput').value = "";

 // Bajty w Windows-1250 dla: "Dzéń dobri! Téż më mómë stôri tekst."
 const bytes = new Uint8Array([
 0x44, 0x7A, 0xE9, 0xF1, 0x20, 0x64, 0x6F, 0x62, 0x72, 0x69, 0x21, 0x20,
 0x54, 0xE9, 0xBF, 0x20, 0x6D, 0xEB, 0x20, 0x6D, 0xF3, 0x6D, 0xEB, 0x20,
 0x73, 0x74, 0xF4, 0x72, 0x69, 0x20, 0x74, 0x65, 0x6B, 0x73, 0x74, 0x2E
 ]);
 rawBuffer = bytes.buffer;
 processData();
 });
 </script>
</body>
</html>
